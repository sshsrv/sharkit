name: "Publish to PyPI"

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.devver.outputs.version || steps.stable.outputs.version }}
      devtag: ${{ steps.devver.outputs.devtag || steps.stable.outputs.devtag }}
      is_dev: ${{ steps.devver.outputs.is_dev || steps.stable.outputs.is_dev }}
      shortsha: ${{ steps.sha.outputs.shortsha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Read base version
        id: base
        run: |
          BASE=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Compute dev pre-release version
        if: github.ref == 'refs/heads/dev'
        id: devver
        run: |
          BASE="${{ steps.base.outputs.base }}"
          echo "Base version: $BASE"
          N=$(curl -fsS https://pypi.org/pypi/sharkit/json 2>/dev/null \
            | jq -r --arg b "$BASE" '.releases | keys[] | select(startswith($b + ".dev")) | sub("^" + $b + ".dev"; "") | select(test("^[0-9]+$"))' 2>/dev/null \
            | sort -n | tail -1) || true
          N=$(( ${N:-0} + 1 ))
          DEVVER="${BASE}.dev${N}"
          DEVTAG="dev${N}"
          echo "Dev version: $DEVVER"
          echo "version=$DEVVER" >> "$GITHUB_OUTPUT"
          echo "devtag=$DEVTAG" >> "$GITHUB_OUTPUT"
          echo "is_dev=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^version = \".*\"/version = \"$DEVVER\"/" pyproject.toml

      - name: Use stable version
        if: github.ref == 'refs/heads/main'
        id: stable
        run: |
          BASE="${{ steps.base.outputs.base }}"
          echo "Stable version: $BASE"
          echo "version=$BASE" >> "$GITHUB_OUTPUT"
          echo "devtag=" >> "$GITHUB_OUTPUT"
          echo "is_dev=false" >> "$GITHUB_OUTPUT"

      - name: Compute short SHA
        id: sha
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke.py

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ format('v{0}', needs.build.outputs.version) }}
          name: ${{ format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.build.outputs.is_dev == 'true' && format('Automated dev pre-release ({0}) built from commit {1}', needs.build.outputs.devtag, needs.build.outputs.shortsha) || format('Automated stable release ({0}) built from commit {1}', needs.build.outputs.version, needs.build.outputs.shortsha) }}
          prerelease: ${{ needs.build.outputs.is_dev == 'true' }}
